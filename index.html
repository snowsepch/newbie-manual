<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>新人快速上手手冊 | Apple Shop</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  :root {
    --header-bg: #F7F4ED;      /* 米白，INKLO 主視覺 header 底色 */
    --body-bg: #FBFAF6;        /* 極淡米白，內容區底色 */
    --frame-bg: #EAE6DB;       /* 手機框外側的桌面底色，只在寬螢幕預覽時可見 */
    --ink: #221D18;            /* 主要文字，暖調近黑取代純黑，質感更軟 */
    --sub-ink: #6E6862;        /* 次要說明文字，同暖灰色階 */
    --tertiary-ink: #9C958C;   /* 最弱層級文字，如規格單位 */
    --line: #EAE4D6;           /* 結構分隔線(header/tabbar)，取代硬黑邊線 */
    --card-line: #EFEBE1;      /* 卡片邊框，比結構分隔線更淡 */
    --shadow-soft: rgba(64, 54, 38, 0.06);   /* 卡片柔和陰影，暖色調而非純黑 */
    --ring: #1D4ED8;           /* 鍵盤聚焦框，取鮮明藍避免與各類別強調色衝突 */
    --tabbar-h: 76px;          /* 底部分類列高度，比對純手機單手操作再放大一點 */
    --phone-w: 430px;          /* 鎖定 iPhone Pro Max 寬度比例，任何裝置開啟都維持手機版面 */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--frame-bg);
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .app-frame {
    width: 100%;
    max-width: var(--phone-w);
    min-height: 100dvh;
    background: var(--body-bg);
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    position: relative;
  }

  @media (min-width: 431px) {
    .app-frame {
      border-left: 1.5px solid #DFDACD;
      border-right: 1.5px solid #DFDACD;
    }
  }

  .tabular { font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 16px -12px var(--shadow-soft), 0 1px 0 var(--shadow-soft);
    padding: max(18px, env(safe-area-inset-top)) 20px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  header h1 {
    margin: 0 0 3px;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.3px;
  }

  header p {
    margin: 0;
    font-size: 12px;
    color: var(--sub-ink);
  }

  /* ---------- Category page ---------- */
  main {
    padding: 16px 16px 32px;
  }

  .category-page { display: none; }
  .category-page.active { display: block; }

  /* ---------- Model select trigger (opens bottom sheet) ---------- */
  .model-select-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #FFFFFF;
    border: 1px solid var(--card-line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 3px 10px var(--shadow-soft);
    transition: transform 0.15s ease;
  }

  .model-select-trigger:active { transform: scale(0.98); }

  .model-select-trigger:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .model-select-trigger .trigger-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .model-select-trigger .trigger-hint {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--sub-ink);
  }

  .model-select-trigger .trigger-name {
    font-size: 16.5px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .model-select-trigger .trigger-chevron {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .model-select-trigger .trigger-chevron i {
    font-size: 16px;
    color: var(--accent-text);
  }

  @media (prefers-reduced-motion: reduce) {
    .model-select-trigger { transition: none; }
  }

  /* ---------- Model picker bottom sheet ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 26, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }

  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  body.sheet-open { overflow: hidden; }

  .model-sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 100%;
    max-width: var(--phone-w);
    max-height: 72vh;
    display: flex;
    flex-direction: column;
    background: var(--body-bg);
    border-radius: 20px 20px 0 0;
    padding-top: 10px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    box-shadow: 0 -10px 34px rgba(26, 26, 26, 0.16);
    transform: translate(-50%, 100%);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 41;
  }

  .model-sheet.open { transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .sheet-backdrop, .model-sheet { transition: none; }
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: #DFDACD;
    margin: 0 auto 10px;
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 12px;
    border-bottom: 1px solid #ECE9E1;
    flex: 0 0 auto;
  }

  .sheet-header span {
    font-size: 15px;
    font-weight: 900;
  }

  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #F1EEE5;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .sheet-close i { font-size: 16px; color: var(--sub-ink); }

  .sheet-close:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .sheet-list {
    overflow-y: auto;
    padding: 6px 12px 4px;
  }

  .sheet-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    min-height: 44px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }

  .sheet-item:active { background: #F1EEE5; }
  .sheet-item.active { background: var(--accent-bg); }

  .sheet-item:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: -2px;
  }

  .sheet-item .item-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sheet-item .item-name {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--ink);
  }

  .sheet-item .item-tagline {
    font-size: 11.5px;
    color: var(--sub-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sheet-item .item-check {
    flex: 0 0 auto;
    font-size: 18px;
    color: var(--accent-text);
    opacity: 0;
  }

  .sheet-item.active .item-check { opacity: 1; }

  /* ---------- Model detail panel ---------- */
  .model-panel { display: none; animation: fadeIn 0.3s ease-out; }
  .model-panel.active { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .model-panel { animation: none; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .model-hero {
    background: linear-gradient(160deg, var(--accent-text) 0%, var(--accent-deep) 100%);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 14px 26px -16px var(--accent-deep);
  }

  .model-hero h2 {
    margin: 0 0 3px;
    font-size: 21px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: -0.3px;
  }

  .model-hero span {
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.85);
  }

  /* spec chip row */
  .spec-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .spec-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FFFFFF;
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 12px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .spec-chip i { font-size: 15px; color: var(--accent-text); }
  .spec-chip .spec-label { color: var(--tertiary-ink); }
  .spec-chip .spec-value { font-weight: 700; color: var(--ink); }

  /* ---------- Section labels ---------- */
  .section-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--sub-ink);
    margin: 20px 0 10px;
  }

  .section-label i { font-size: 15px; color: var(--accent-text); }

  /* ---------- Feature tiles (3 記憶關鍵詞) ---------- */
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }

  .feature-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 7px;
    min-height: 100px;
    padding: 14px 6px 12px;
    border-radius: 14px;
    background: #FFFFFF;
    border: 1px solid var(--card-line);
    box-shadow: 0 3px 10px var(--shadow-soft);
  }

  .feature-tile .tile-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .feature-tile .tile-icon i {
    font-size: 19px;
    color: var(--accent-text);
  }

  .feature-tile strong {
    font-size: 14px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }

  .feature-tile span {
    font-size: 11px;
    line-height: 1.45;
    color: var(--sub-ink);
  }

  /* ---------- Demo scenario ---------- */
  .demo-box {
    background: #FFFFFF;
    border: 1px solid var(--card-line);
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    box-shadow: 0 3px 10px var(--shadow-soft);
  }

  /* ---------- Script quote ---------- */
  .script-box {
    background: var(--accent-bg);
    border-radius: 12px;
    padding: 16px 16px 14px;
  }

  .script-box p {
    margin: 0 0 12px;
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink);
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: #FFFFFF;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    min-height: 42px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .copy-btn:active { transform: scale(0.97); }

  .copy-btn:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .copy-btn.copied { background: var(--accent-text); }

  /* ---------- Bottom tab bar ---------- */
  nav.tabbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: var(--phone-w);
    height: var(--tabbar-h);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--header-bg);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 16px -12px var(--shadow-soft), 0 -1px 0 var(--shadow-soft);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 30;
  }

  @media (min-width: 431px) {
    nav.tabbar {
      border-left: 1.5px solid #DFDACD;
      border-right: 1.5px solid #DFDACD;
    }
  }

  nav.tabbar button {
    background: none;
    border: none;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--sub-ink);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 0 0;
  }

  nav.tabbar button i { font-size: 24px; }

  nav.tabbar button:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: -2px;
  }

  nav.tabbar button.active { color: var(--tab-active-color, var(--ink)); }

  /* per-category accent tokens：--accent-bg 清新柔霧淡底(圖示晶片用)、--accent-text 清新中調色(圖示/強調字/導覽字，明亮但對比足夠)、--accent-deep 深邃同色調(hero漸層深端，承載白字) */
  .cat-mac    { --accent-bg:#E5EAF1; --accent-text:#4A6FA0; --accent-deep:#263953; }
  .cat-ipad   { --accent-bg:#E5EBE8; --accent-text:#47775C; --accent-deep:#243D2F; }
  .cat-iphone { --accent-bg:#F1E7E2; --accent-text:#A25834; --accent-deep:#542D1B; }
  .cat-watch  { --accent-bg:#F2E6EC; --accent-text:#A8527A; --accent-deep:#572A3F; }
</style>
</head>
<body>

<div class="app-frame">

<header>
  <h1>新人快速上手手冊</h1>
  <p>17 款現役機型 · 30 秒快速記憶 · 隨看隨用</p>
</header>

<main>

  <!-- ================= Mac ================= -->
  <section class="category-page cat-mac active" data-category="mac">
    <button type="button" class="model-select-trigger" data-selector="mac"></button>
    <div data-panels="mac"></div>
  </section>

  <!-- ================= iPad ================= -->
  <section class="category-page cat-ipad" data-category="ipad">
    <button type="button" class="model-select-trigger" data-selector="ipad"></button>
    <div data-panels="ipad"></div>
  </section>

  <!-- ================= iPhone ================= -->
  <section class="category-page cat-iphone" data-category="iphone">
    <button type="button" class="model-select-trigger" data-selector="iphone"></button>
    <div data-panels="iphone"></div>
  </section>

  <!-- ================= Apple Watch ================= -->
  <section class="category-page cat-watch" data-category="watch">
    <button type="button" class="model-select-trigger" data-selector="watch"></button>
    <div data-panels="watch"></div>
  </section>

</main>

</div>

<nav class="tabbar">
  <button type="button" class="cat-tab active" data-target="mac" style="--tab-active-color:#4A6FA0">
    <i class="ph ph-laptop"></i>Mac
  </button>
  <button type="button" class="cat-tab" data-target="ipad" style="--tab-active-color:#47775C">
    <i class="ph ph-device-tablet"></i>iPad
  </button>
  <button type="button" class="cat-tab" data-target="iphone" style="--tab-active-color:#A25834">
    <i class="ph ph-device-mobile"></i>iPhone
  </button>
  <button type="button" class="cat-tab" data-target="watch" style="--tab-active-color:#A8527A">
    <i class="ph ph-watch"></i>Watch
  </button>
</nav>

<div class="sheet-backdrop" data-sheet-backdrop></div>
<div class="model-sheet" data-model-sheet>
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span data-sheet-title></span>
    <button type="button" class="sheet-close" data-sheet-close aria-label="關閉">
      <i class="ph ph-x"></i>
    </button>
  </div>
  <div class="sheet-list" data-sheet-list></div>
</div>

    sheetTitleEl.textContent = `選擇 ${CATEGORY_LABEL[cat]} 機型`;
    sheetListEl.innerHTML = models.map(m => `
      <button type="button" class="sheet-item${m.id === currentModel[cat] ? " active" : ""}" data-select-model="${m.id}">
        <span class="item-text">
          <span class="item-name">${m.name}</span>
          <span class="item-tagline">${m.tagline}</span>
        </span>
        <i class="ph ph-check item-check"></i>
      </button>
    `).join("");

    document.body.classList.add("sheet-open");
    requestAnimationFrame(() => {
      sheetBackdrop.classList.add("open");
      modelSheet.classList.add("open");
    });
  }

  function closeSheet() {
    sheetBackdrop.classList.remove("open");
    modelSheet.classList.remove("open");
    document.body.classList.remove("sheet-open");
    activeSheetCat = null;
  }

  function selectModel(cat, modelId) {
    currentModel[cat] = modelId;
    const model = DATA[cat].find(m => m.id === modelId);
    const panelsEl = document.querySelector(`[data-panels="${cat}"]`);
    const triggerEl = document.querySelector(`[data-selector="${cat}"]`);

    panelsEl.querySelectorAll(".model-panel").forEach(p =>
      p.classList.toggle("active", p.dataset.panel === modelId)
    );
    triggerEl.querySelector("[data-trigger-name]").textContent = model.name;
    closeSheet();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  sheetBackdrop.addEventListener("click", closeSheet);
  document.querySelector("[data-sheet-close]").addEventListener("click", closeSheet);

  sheetListEl.addEventListener("click", (e) => {
    const item = e.target.closest(".sheet-item");
    if (!item || !activeSheetCat) return;
    selectModel(activeSheetCat, item.dataset.selectModel);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && activeSheetCat) closeSheet();
  });

  const catTabs = document.querySelectorAll("nav.tabbar .cat-tab");
  const catPages = document.querySelectorAll(".category-page");

  catTabs.forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.target;
      catTabs.forEach(b => b.classList.toggle("active", b === btn));
      catPages.forEach(p => p.classList.toggle("active", p.dataset.category === target));
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    });
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;

    const text = btn.dataset.copyText;
    const done = () => {
      const original = btn.innerHTML;
      btn.classList.add("copied");
      btn.innerHTML = '<i class="ph ph-check"></i>已複製';
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = original;
      }, 1600);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, cb) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    cb();
  }

  // 支援從工具站帶入的個人化參數：?cat= 預設分類、?name= 暱稱問候
  (function initFromQuery() {
    const params = new URLSearchParams(location.search);

    const cat = params.get("cat");
    if (CATEGORIES.includes(cat)) {
      const tab = document.querySelector(`nav.tabbar .cat-tab[data-target="${cat}"]`);
      if (tab) tab.click();
    }

    const name = (params.get("name") || "").trim().slice(0, 12);
    if (name) {
      const greet = document.createElement("p");
      greet.style.margin = "4px 0 0";
      greet.style.fontSize = "12px";
      greet.style.fontWeight = "700";
      greet.style.color = "var(--ink)";
      greet.textContent = `Hi, ${name}，歡迎回來`;
      document.querySelector("header").appendChild(greet);
    }
  })();
</script>

</body>
</html>
